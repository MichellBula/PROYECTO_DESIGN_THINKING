name: Unit Tests

on:
  push:
    branches: [ main, PAULA_BRANCH,Sebastian_BRANCH, MICHAEL_BRANCH, Emanuel_roble]
  pull_request:
    branches: [ main, PAULA_BRANCH,Sebastian_BRANCH,MICHAEL_BRANCH, Emanuel_roble]
  workflow_dispatch:

jobs:
  unit_test:
    name: Pruebas Unitarias (Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    defaults:
      run:
        working-directory: PROYECTO-FLUTTER/uncampusconnet

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # Este comando corre todo lo que esté en la carpeta test/
      - name: Ejecutar pruebas unitarias
        run: flutter test test/units