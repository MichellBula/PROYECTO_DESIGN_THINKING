
name: Widget Tests - Flutter

on:
  push:
    branches:
      - MICHELL_BRANCH
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  widget_tests:
    name: Pruebas de Widgets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: PROYECTO-FLUTTER/uncampusconnet

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Ejecutar pruebas de widgets
        run: flutter test test/widgets
