name: Integration Tests

on:
  push:
    branches: [ main, PAULA_BRANCH ]
  pull_request:
    branches: [ main, PAULA_BRANCH ]
  workflow_dispatch:

jobs:
  integration_test:
    name: Pruebas de Integración (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    defaults:
      run:
        working-directory: PROYECTO-FLUTTER/uncampusconnet

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Instalar ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Iniciar ChromeDriver en segundo plano
        run: |
          nohup chromedriver --port=4444 > /tmp/chromedriver.log 2>&1 &
          sleep 3

      - name: Ejecutar pruebas de integración
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/crear_proyecto_test.dart \
            -d web-server \
            --web-browser-flag="--headless" \
            --web-browser-flag="--no-sandbox" \
            --web-browser-flag="--disable-gpu"