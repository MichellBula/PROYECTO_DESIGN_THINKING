name: Integration Tests

on:
  push:
    branches: [ main, PAULA_BRANCH ]
  pull_request:
    branches: [ main, PAULA_BRANCH ]
  workflow_dispatch:

jobs:
  integration_test:
    name: Pruebas de Integración (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    defaults:
      run:
        working-directory: PROYECTO-FLUTTER/uncampusconnet

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      # Esta acción oficial instala y levanta el chromedriver correctamente
      - name: Configurar ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Ejecutar pruebas de integración en Chrome
        run: |
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/auth_test.dart -d web-server --web-browser-flag="--headless"